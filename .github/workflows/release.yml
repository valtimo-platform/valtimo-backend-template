name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The version to be released'
        required: true
  repository_dispatch:
    types: [release]

env:
  VERSION: ${{ inputs.version || github.event.client_payload.version }}

  DOCKER_REPO: ritense/valtimo-backend

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upgrade version
        run: sed -i "s/valtimoVersion=.*/valtimoVersion=${{ env.VERSION }}/" gradle.properties

      - name: Determine JDK version
        id: jdk
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          if [[ "$BRANCH" == v/10* || "$BRANCH" == v/11* ]]; then
            echo "version=17" >> "$GITHUB_OUTPUT"
          else
            echo "version=21" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ steps.jdk.outputs.version }}

      - name: Build application
        run: ./gradlew clean build

      - name: Commit version update
        run: |
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -am "Upgrade to ${{ env.VERSION }}"
            git push

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64/v8
          push: true
          tags: ${{ env.DOCKER_REPO }}:${{ env.VERSION }}
