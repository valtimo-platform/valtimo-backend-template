name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The version to be released'
        required: true
        default: '1.0.0'

env:
  DOCKER_REPO: ritense/valtimo-backend

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine JDK version
        id: jdk
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          if [[ "$BRANCH" == v/10* || "$BRANCH" == v/11* ]]; then
            echo "version=17" >> "$GITHUB_OUTPUT"
          else
            echo "version=21" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ steps.jdk.outputs.version }}

      - name: Build application
        run: ./gradlew clean build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64/v8
          push: true
          tags: ${{ env.DOCKER_REPO }}:${{ inputs.version }}
